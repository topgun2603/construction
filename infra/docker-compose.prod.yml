name: sitebook

# Production-ish single-host compose: app containers only. Postgres, Redis and
# object storage are managed services in prod (spec §4, "Hosting (initial)").

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3000/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      NODE_ENV: production
      PORT: '3001'
    ports:
      - '3001:3001'
    depends_on:
      - api
