name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sitebook
          POSTGRES_PASSWORD: sitebook
          POSTGRES_DB: sitebook
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sitebook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # sitebook_app, not sitebook: the latter is the cluster superuser and bypasses
      # RLS, which would make the tenancy isolation suite pass while testing nothing.
      DATABASE_URL: postgresql://sitebook_app:sitebook@localhost:5432/sitebook?schema=public
      SHADOW_DATABASE_URL: postgresql://sitebook_app:sitebook@localhost:5432/sitebook_shadow?schema=public
      JWT_SECRET: ci-access-secret-that-is-definitely-long-enough
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-definitely-long-enough
      DEV_AUTH_BYPASS: 'true'

      # Object storage. Without it every presigned-upload route answers 500, which took out the
      # portal and media suites the first time e2e ever ran here â€” the photo and document tests are
      # precisely the ones that exercise storage, so stubbing it would test nothing.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: ap-south-1
      S3_BUCKET: sitebook-media
      S3_ACCESS_KEY_ID: sitebook
      S3_SECRET_ACCESS_KEY: sitebook123
      S3_FORCE_PATH_STYLE: 'true'

      # The platform console. Both halves or neither â€” the env schema refuses a half-configured
      # console, because one wired to the app's own connection would find every RLS policy matching
      # zero rows and quietly show an empty database.
      ADMIN_DATABASE_URL: postgresql://sitebook_admin:sitebook@localhost:5432/sitebook?schema=public
      PLATFORM_ADMIN_PHONES: '919000000001'

      # Queues off. The worker is a separate process and no suite asserts on a job running; leaving
      # them on would make every test wait on a Redis that is not there.
      JOBS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json declares `packageManager: pnpm@9.12.0`, and the
      # action refuses outright when it is told twice â€” naming it in both places is how the two
      # drift apart and CI ends up installing with a pnpm the lockfile was not written by.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @sitebook/shared build

      - run: pnpm --filter @sitebook/api prisma:generate

      # The compose file does this from /docker-entrypoint-initdb.d; a GitHub
      # service container has no such hook, so run it explicitly.
      - name: Create the non-superuser application role
        env:
          PGPASSWORD: sitebook
        run: |
          psql -h localhost -U sitebook -d sitebook -v ON_ERROR_STOP=1 \
            -f infra/postgres/init/01-app-role.sql

      # The BYPASSRLS role the platform console connects as. Optional in a real deployment â€” which
      # is why every migration guards its GRANT â€” but the console suite cannot run without it.
      - name: Create the platform console role
        env:
          PGPASSWORD: sitebook
        run: |
          psql -h localhost -U sitebook -d sitebook -v ON_ERROR_STOP=1 \
            -f infra/postgres/init/02-admin-role.sql
          psql -h localhost -U sitebook -d sitebook -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE sitebook_admin WITH PASSWORD 'sitebook'"

      # MinIO as a step rather than a service container: `services:` cannot override a command, and
      # quay.io/minio/minio does nothing without `server /data`.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=sitebook -e MINIO_ROOT_PASSWORD=sitebook123 \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && break
            sleep 1
          done
          docker run --rm --network host --entrypoint sh quay.io/minio/mc:latest -c "
            mc alias set ci http://localhost:9000 sitebook sitebook123 &&
            mc mb --ignore-existing ci/sitebook-media
          "

      - name: Apply migrations
        run: pnpm --filter @sitebook/api prisma:deploy

      # The hand-written migration SQL and schema.prisma must describe the same
      # database; a mismatch means the next `prisma migrate dev` would reset.
      - name: Check for schema drift
        env:
          PGPASSWORD: sitebook
        run: |
          psql -h localhost -U sitebook -d postgres \
            -c 'CREATE DATABASE sitebook_shadow OWNER sitebook_app' || true
          pnpm --filter @sitebook/api prisma:drift

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm --filter @sitebook/api test:e2e

      - run: pnpm build
